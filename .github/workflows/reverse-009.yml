# Temporary, never merged. Runs the commands named in requestfromweb-009 on the 008 head plus eight small patches.
name: reverse-009

on:
  push:
    branches: [reverse/refactor2-009]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai
  START_SHA: 652d0e6c1bb2e7b4b33d08d8ae8d30b1f625a231

jobs:
  runtime:
    name: R009 runtime (sections 1, 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_USE_IO_URING: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Environment and prepared prefixes
        run: |
          set +e
          . .reverse/009/r.sh
          echo "R009: job=runtime head=$(git rev-parse HEAD) start=$(git rev-parse $START_SHA)"
          echo "R009: id=$(id)"
          echo "R009: node=$(node -v) npm=$(npm -v) python=$(python3 -V) os=$(. /etc/os-release; echo $PRETTY_NAME)"
          grep -E '^Cap(Eff|Prm|Bnd)' /proc/self/status | sed 's/^/R009: /'
          version=$(sed -nE 's/^DSH_VERSION="\$\{DSH_VERSION:-(.+)\}"$/\1/p' runtime/build-runtime.sh)
          echo "R009: dsh-version=$version"
          prefix="$RUNNER_TEMP/dsh"
          mkdir "$prefix"
          cp "runtime/locks/dsh-$version/package.json" "runtime/locks/dsh-$version/package-lock.json" "$prefix/"
          R "prefix npm ci" "npm ci --prefix '$prefix' --ignore-scripts --no-audit --no-fund"
          cp "$prefix/node_modules/@deepseek-ai/dsh-fs-local/lib/index.js" "$prefix/fs-local-original.js"
          R "prefix patch-dsh" "python3 -I runtime/lib/rtbuild.py patch-dsh --prefix '$prefix' --dsh-version '$version'"
          pnpm_version=$(sed -nE 's/^PNPM_VERSION="\$\{PNPM_VERSION:-(.+)\}"$/\1/p' runtime/build-runtime.sh)
          pnpm_prefix="$RUNNER_TEMP/pnpm"
          mkdir "$pnpm_prefix"
          cp "runtime/locks/pnpm-$pnpm_version/package.json" "runtime/locks/pnpm-$pnpm_version/package-lock.json" "$pnpm_prefix/"
          R "pnpm npm ci" "npm ci --prefix '$pnpm_prefix' --ignore-scripts --no-audit --no-fund"
          cp -a "$prefix" "$RUNNER_TEMP/dsh-clean"
          echo "R009: clean prefix copy exit=$?"
          {
            echo "DSH_PREFIX=$prefix"
            echo "DSH_TEST_PREFIX=$prefix"
            echo "PNPM_BIN=$pnpm_prefix/node_modules/pnpm/bin/pnpm.mjs"
            echo "DSH_INSTALL=$prefix/node_modules/@deepseek-ai/dsh"
            echo "DSH_TOOLS_DIR=$prefix/node_modules/@deepseek-ai/dsh-tools"
            echo "DSH_FS_LOCAL_ORIGINAL_JS=$prefix/fs-local-original.js"
          } >> "$GITHUB_ENV"
      - name: Section 1, node tests and python
        run: |
          set +e
          . .reverse/009/r.sh
          fresh() { rm -rf "$DSH_PREFIX" && cp -a "$RUNNER_TEMP/dsh-clean" "$DSH_PREFIX"; }
          fresh
          R "node full" "node --test --test-reporter=spec runtime/tests/*.test.mjs app/tool/engine_auth/*.test.mjs"
          NS node-full
          S node-full-named '(5307 |inventory freshness|manifest ownership|micro generation|native-micro)'
          fresh
          R "python patch_dsh" "python3 -I runtime/tests/test_patch_dsh.py"
          S python-tail '(^Ran |^OK|^FAILED|passed|failed)'
          # Supplementary single-file runs, each on a fresh copy of the clean prefix.
          fresh
          R "node native-micro-manifest-owner" "node --test --test-reporter=spec runtime/tests/native-micro-manifest-owner.test.mjs"
          NS micro-owner
          S micro-owner-lines 'manifest ownership'
          fresh
          R "node native-capabilities" "node --test --test-reporter=spec runtime/tests/native-capabilities.test.mjs"
          NS native-capabilities
          S native-capabilities-5307 '5307 '
          fresh
          R "node native-micro-generation" "node --test --test-reporter=spec runtime/tests/native-micro-generation.test.mjs"
          NS micro-generation
          S micro-generation-lines '^\s*(✔|✖|﹣) '
          fresh
          R "node bridge-http-errors" "node --test --test-reporter=spec runtime/tests/bridge-http-errors.test.mjs"
          NS bridge-http-errors
          grep -aiE 'inventory freshness' "$LAST" | sed 's/^/R009: bridge-http-errors-freshness| /'
      - name: Section 2, media and example plugins
        run: |
          set +e
          . .reverse/009/r.sh
          R "media npm install" "cd runtime/media/dsh-media && npm install --ignore-scripts --no-package-lock --no-audit --no-fund"
          R "media npm test" "cd runtime/media/dsh-media && npm test -- --test-reporter=spec"
          NS media
          S media-completed-video '(completed video|completed-video)'
          git status --short | sed 's/^/R009: status-after-media| /'
          for plugin in examples/plugins/dsh-go-example-*/; do
            name=$(basename "$plugin")
            R "example $name npm test" "cd '$plugin' && npm test"
            S "example-$name-test" '^ℹ (tests|pass|fail|cancelled|skipped) '
            R "example $name npm run check" "cd '$plugin' && npm run check"
          done
      - name: Section 2, guard and native tests
        run: |
          set +e
          . .reverse/009/r.sh
          fresh() { rm -rf "$DSH_PREFIX" && cp -a "$RUNNER_TEMP/dsh-clean" "$DSH_PREFIX"; }
          fresh
          R "run-guard-tests" "bash runtime/tests/run-guard-tests.sh '$DSH_PREFIX'"
          S guard-tail '(^ℹ |pass|fail|PASS|FAIL|ok )'
          fresh
          R "run-native-tests" "bash runtime/tests/run-native-tests.sh '$DSH_PREFIX'"
          S native-tail '(^ℹ |pass|fail|PASS|FAIL|ok )'
      - name: Verdict
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/r9-fails.txt" ]; then echo "R009: job=runtime FAILED COMMANDS:"; sed 's/^/R009: /' "$RUNNER_TEMP/r9-fails.txt"; exit 1; fi
          echo "R009: job=runtime all commands exit 0"

  dart:
    name: R009 dart (section 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn # The registry the lockfiles were resolved from.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Section 3
        run: |
          set +e
          . .reverse/009/r.sh
          echo "R009: job=dart head=$(git rev-parse HEAD) start=$(git rev-parse $START_SHA)"
          echo "R009: id=$(id)"
          echo "R009: $(dart --version 2>&1)"
          R "dart pub get dsh_client" "cd packages/dsh_client && dart pub get --enforce-lockfile"
          R "format dsh_go_api" "dart format --output=none --set-exit-if-changed --line-length=120 packages/dsh_client/lib/src/dsh_go_api.dart"
          S format-dsh_go_api '(Changed|Formatted)'
          R "format inventory" "cd packages/dsh_client && dart format --output=none --set-exit-if-changed --line-length=120 lib/src/client_inventory_api.dart test/client_inventory_api_test.dart"
          S format-inventory '(Changed|Formatted)'
          R "dart analyze" "cd packages/dsh_client && dart analyze"
          S analyze-tail '(No issues|issues? found|error|warning|info)'
          R "dart test inventory" "cd packages/dsh_client && dart test --reporter expanded test/client_inventory_api_test.dart"
          S dart-test-lines '^[0-9:]+ \+[0-9]+'
          # Diff of what the formatter would do to dsh_go_api.dart, for the receipt (the tree is not modified).
          dart format --line-length=120 packages/dsh_client/lib/src/dsh_go_api.dart > /dev/null 2>&1
          git diff -- packages/dsh_client/lib/src/dsh_go_api.dart | sed 's/^/R009: format-diff| /' | head -80
          if [ -s "$RUNNER_TEMP/r9-fails.txt" ]; then echo "R009: job=dart FAILED COMMANDS:"; sed 's/^/R009: /' "$RUNNER_TEMP/r9-fails.txt"; exit 1; fi
          echo "R009: job=dart all commands exit 0"

  flutter:
    name: R009 flutter (sections 4, 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
      NOTO_CJK_VERSION: 1:20230817+repack1-3
      NOTO_EMOJI_VERSION: v2.051
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore the fonts the goldens were drawn with
        id: fonts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/test-fonts
          key: test-fonts-${{ env.NOTO_CJK_VERSION }}-${{ env.NOTO_EMOJI_VERSION }}
      - name: Download the fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          mkdir -p ~/test-fonts
          cp unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc ~/test-fonts/
          curl -fsSL --retry 3 -o ~/test-fonts/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $HOME/test-fonts/NotoColorEmoji.ttf" | sha256sum -c -
          exit 0
      - name: Install the fonts
        run: |
          set +e
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" ~/test-fonts/NotoSansCJK-*.ttc
          sudo install -Dm644 ~/test-fonts/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
          exit 0
      - name: Trees and drafts
        run: |
          set +e
          . .reverse/009/r.sh
          echo "R009: job=flutter target=$(git rev-parse HEAD) start=$(git rev-parse $START_SHA)"
          echo "R009: id=$(id)"
          echo "R009: $(flutter --version 2>&1 | head -3 | tr '\n' ' ')"
          R "worktree start" "git worktree add --detach '$RUNNER_TEMP/start' $START_SHA"
          for tree in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/start"; do
            mkdir -p "$tree/app/test/runtime" "$tree/app/test/update"
            cp .reverse/009/owner-tests/runtime_bridge_subscription_test.dart .reverse/009/owner-tests/runtime_bridge_parsing_test.dart "$tree/app/test/runtime/"
            cp .reverse/009/owner-tests/update_delta_cleanup_test.dart "$tree/app/test/update/"
            echo "R009: tree=$tree head=$(git -C "$tree" rev-parse HEAD)"
            ( cd "$tree/app/test" && sha256sum runtime/runtime_bridge_subscription_test.dart runtime/runtime_bridge_parsing_test.dart update/update_delta_cleanup_test.dart ) | sed 's/^/R009: draft-sha256| /'
          done
          R "pub get target" "cd '$GITHUB_WORKSPACE/app' && flutter pub get --enforce-lockfile"
          R "pub get start" "cd '$RUNNER_TEMP/start/app' && flutter pub get --enforce-lockfile"
      - name: Section 4, the 3-file command on both trees
        run: |
          set +e
          . .reverse/009/r.sh
          files="test/runtime/runtime_bridge_subscription_test.dart test/runtime/runtime_bridge_parsing_test.dart test/update/update_delta_cleanup_test.dart"
          R "flutter test 3 files START" "cd '$RUNNER_TEMP/start/app' && flutter test --no-pub --reporter expanded $files"
          S start-lines '^[0-9:]+ [+~-]'
          S start-fail 'Expected|Actual|\[E\]|Some tests failed|All tests passed|Error:|error:'
          R "flutter test 3 files TARGET" "cd '$GITHUB_WORKSPACE/app' && flutter test --no-pub --reporter expanded $files"
          S target-lines '^[0-9:]+ [+~-]'
          S target-fail 'Expected|Actual|\[E\]|Some tests failed|All tests passed|Error:|error:'
          echo "R009: step done"
      - name: Section 4, regressions, format and analyze on the target
        run: |
          set +e
          . .reverse/009/r.sh
          cd "$GITHUB_WORKSPACE/app"
          R "flutter test runtime regressions" "flutter test --no-pub --reporter expanded test/runtime/runtime_logs_test.dart test/runtime/runtime_controller_test.dart test/runtime/runtime_reset_keep_test.dart"
          S runtime-reg-lines '^[0-9:]+ [+~-]'
          S runtime-reg-fail 'Expected|Actual|\[E\]|Some tests failed|All tests passed'
          R "flutter test update regressions" "flutter test --no-pub --reporter expanded test/update/update_delta_test.dart test/update/downloader_test.dart test/update/update_cached_cancel_test.dart test/update/update_file_completion_cancel_test.dart test/update/update_digest_binding_test.dart test/update/update_ownership_test.dart"
          S update-reg-lines '^[0-9:]+ [+~-]'
          S update-reg-fail 'Expected|Actual|\[E\]|Some tests failed|All tests passed'
          five="lib/runtime/runtime_bridge.dart lib/update/downloader.dart test/runtime/runtime_bridge_subscription_test.dart test/runtime/runtime_bridge_parsing_test.dart test/update/update_delta_cleanup_test.dart"
          R "dart format 5 files" "dart format --output=none --set-exit-if-changed --line-length=120 $five"
          S format5 '(Changed|Formatted)'
          R "flutter analyze 5 files" "flutter analyze --no-pub $five"
          S analyze5 '(error|warning|info|No issues|issues found)'
          # What the formatter would change, as a diff on temporary copies.
          mkdir -p "$RUNNER_TEMP/fmtcopy" && for f in $five; do mkdir -p "$RUNNER_TEMP/fmtcopy/$(dirname $f)"; cp $f "$RUNNER_TEMP/fmtcopy/$f"; done
          ( cd "$RUNNER_TEMP/fmtcopy" && dart format --line-length=120 $five >/dev/null 2>&1; for f in $five; do diff -u "$GITHUB_WORKSPACE/app/$f" "$f"; done | sed 's/^/R009: format5-diff| /' | head -200 )
          echo "R009: step done"
      - name: Section 6, optional companion case on both trees
        run: |
          set +e
          . .reverse/009/r.sh
          name='voice page MiMo from the presets: a key and a voice are all it takes'
          R "companion START" "cd '$RUNNER_TEMP/start/app' && flutter test --no-pub --reporter expanded test/companion/companion_voice_test.dart --plain-name '$name'"
          S companion-start '(^[0-9:]+ [+~-]|Expected|Actual|Found|could not find|Some tests failed|All tests passed)'
          R "companion TARGET" "cd '$GITHUB_WORKSPACE/app' && flutter test --no-pub --reporter expanded test/companion/companion_voice_test.dart --plain-name '$name'"
          S companion-target '(^[0-9:]+ [+~-]|Expected|Actual|Found|could not find|Some tests failed|All tests passed)'
          echo "R009: step done"
      - name: Verdict
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/r9-fails.txt" ]; then echo "R009: job=flutter FAILED COMMANDS:"; sed 's/^/R009: /' "$RUNNER_TEMP/r9-fails.txt"; exit 1; fi
          echo "R009: job=flutter all commands exit 0"

  kotlin:
    name: R009 kotlin (section 5)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_MAVEN_MIRRORS: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Section 5
        run: |
          set +e
          . .reverse/009/r.sh
          echo "R009: job=kotlin head=$(git rev-parse HEAD) start=$(git rev-parse $START_SHA)"
          echo "R009: id=$(id)"
          echo "R009: $(java -version 2>&1 | head -1) | $(gradle --version 2>&1 | grep -E '^Gradle' )"
          ls app/android/app/build/test-results 2>&1 | sed 's/^/R009: preexisting-results| /'
          R "pub get" "cd app && flutter pub get --enforce-lockfile && printf 'sdk.dir=%s\nflutter.sdk=%s\n' \"\$ANDROID_HOME\" \"\$FLUTTER_ROOT\" > android/local.properties"
          R "gradle testArm64DebugUnitTest" "cd app/android && gradle --stacktrace :app:testArm64DebugUnitTest --rerun --tests '*FailureLogsTest' --tests '*RuntimeLogsTest' --tests '*CrashClassifierTest' --tests '*PrivateKeyCrashEvidenceTest' --tests '*SafePolicyTest' --tests '*StartupFailureStateTest' --tests 'io.github.ccch1mneyyy.dsh_app.phone.PhoneTaskSessionsTest.offOnAndEngineRestartCannotAdmitANewDriverAheadOfOldOffCleanup' --tests 'io.github.ccch1mneyyy.dsh_app.runtime.LogRedactorTest.sharedDiagnosticsVectorsAndIdempotence'"
          S gradle-summary '(FAILED|tests completed|BUILD |Expected|expected|Actual|actual|ComparisonFailure|AssertionError)'
          find "$GITHUB_WORKSPACE" -name 'TEST-*.xml' -path '*testArm64DebugUnitTest*' | sed 's/^/R009: junit-found| /'
          python3 .reverse/009/junit.py $(find "$GITHUB_WORKSPACE" -name 'TEST-*.xml' -path '*testArm64DebugUnitTest*' | sort)
          echo "R009: junit python exit=$?"
          if [ -s "$RUNNER_TEMP/r9-fails.txt" ]; then echo "R009: job=kotlin FAILED COMMANDS:"; sed 's/^/R009: /' "$RUNNER_TEMP/r9-fails.txt"; exit 1; fi
          echo "R009: job=kotlin all commands exit 0"
